server {
    listen 80;
    server_name theshort.ru www.theshort.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name theshort.ru www.theshort.ru;

    ssl_certificate /etc/letsencrypt/live/theshort.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theshort.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/theshort.ru/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    client_max_body_size 2k;

    location ~* \.(env|php|json|yml|yaml|config|bak|old|swp|sql|db|log)$ {
        return 444;
    }

    location ~* /(admin|wp-|wordpress|joomla|drupal|backup|shell|exec|phpmyadmin|pma|xmlrpc|_all|status|info|config|cron|vendor|composer|node_modules|\.git|\.svn) {
        return 444;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4356;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
