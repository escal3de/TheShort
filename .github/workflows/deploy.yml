name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            # Создаём нужные папки
            mkdir -p /opt/theshort/repo /opt/theshort/publish /opt/theshort/frontend

            cd /opt/theshort/repo
            git reset --hard origin/main
            git pull origin main

            # Устанавливаем юниты systemd
            cp deploy/systemd/theshort-api.service /etc/systemd/system/
            cp deploy/systemd/theshort-frontend.service /etc/systemd/system/
            systemctl daemon-reload

            # Бэкапим конфиг
            cp /opt/theshort/publish/appsettings.Production.json /tmp/apsProd.json 2>/dev/null || true

            # Останавливаем бэкенд перед публишем (файлы заблокированы)
            systemctl stop theshort-api 2>/dev/null || true

            # Собираем .NET бэкенд
            /usr/bin/dotnet publish TheShort.Api/TheShort.Api.csproj \
              -c Release -o /opt/theshort/publish

            # Возвращаем конфиг
            cp /tmp/apsProd.json /opt/theshort/publish/appsettings.Production.json 2>/dev/null || true

            # Останавливаем фронтенд перед копированием
            systemctl stop theshort-frontend 2>/dev/null || true

            # Собираем фронтенд
            cd /opt/theshort/repo/TheShort.Frontend
            npm ci
            npm run build

            # Копируем сборку
            rm -rf /opt/theshort/frontend/*
            cp -r .next /opt/theshort/frontend/.next
            cp -r public /opt/theshort/frontend/public 2>/dev/null || true
            cp -r node_modules /opt/theshort/frontend/node_modules
            cp package.json /opt/theshort/frontend/

            # Перезапускаем всё
            systemctl enable theshort-api theshort-frontend 2>/dev/null || true
            systemctl restart nginx
            systemctl start theshort-api
            systemctl start theshort-frontend

            echo "=== Deployed Successfully ==="
